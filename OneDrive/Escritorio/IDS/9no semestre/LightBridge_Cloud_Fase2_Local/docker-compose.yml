services:
  lightbridge:
    build: .
    container_name: lightbridge_local
    environment:
      ROLE: MASTER
      ZONE: ZONA-CENTRAL (Master)
      LOCAL_MODE: "true"
      PORT: "5000"
      LOCAL_DB_PATH: /data/lightbridge_local.db
    ports:
      - "5000:5000"
    volumes:
      - lightbridge_data:/data
    restart: unless-stopped

volumes:
  lightbridge_data:

